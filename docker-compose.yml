version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: bhagauti_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - bhagauti_network

  celery_worker:
    build: .
    container_name: bhagauti_celery_worker
    command: celery -A app.core.celery_app worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - bhagauti_network

  celery_beat:
    build: .
    container_name: bhagauti_celery_beat
    command: celery -A app.core.celery_app beat --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - bhagauti_network

  web:
    build: .
    container_name: bhagauti_web
    command: python app.py
    volumes:
      - .:/app
    ports:
      - "5000:5000"
    depends_on:
      - redis
      - celery_worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - bhagauti_network

volumes:
  redis_data:

networks:
  bhagauti_network:
    driver: bridge
